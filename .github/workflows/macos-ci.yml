name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"

      - name: Install conversion engines used by the checks
        if: matrix.arch == 'arm64'
        run: Scripts/install-ci-engines.sh

      # The pinned LibreOffice artifact is arm64-only; the harness skips its
      # optional checks on Intel where that vendor package is unavailable.
      - name: Install LibreOffice for spreadsheet checks
        if: matrix.arch == 'arm64'
        run: Scripts/install-ci-libreoffice.sh

      - name: Build Morph
        run: swift build --product Morph

      - name: Run real-file conversion checks
        run: Scripts/run-checks.sh

  universal-package:
    name: Build and verify universal package
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit the Homebrew Cask draft
        run: |
          tap="codex/morph-cask-validation"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/homebrew-validation-config"
          mkdir -p "$XDG_CONFIG_HOME"
          brew tap-new --no-git "$tap"
          tap_dir="$(brew --repository "$tap")"
          mkdir -p "$tap_dir/Casks"
          cp distribution/homebrew/morph.rb "$tap_dir/Casks/morph.rb"
          brew trust --cask "$tap/morph"
          set +e
          brew audit --cask "$tap/morph"
          audit_status=$?
          brew style --cask "$tap/morph"
          style_status=$?
          set -e
          if [[ "$audit_status" -ne 0 || "$style_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Build package
        run: MORPH_DIST_DIR="$RUNNER_TEMP/morph-dist" Scripts/package-release.sh

      - name: Verify universal archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          app="$RUNNER_TEMP/morph-dist/Morph.app"
          archive="$RUNNER_TEMP/morph-dist/Morph-${version}-macOS-universal.zip"
          helper="$app/Contents/Helpers/MorphQuickConvert.app"
          finder_sync="$app/Contents/PlugIns/MorphFinderSync.appex"
          archs="$(lipo -archs "$app/Contents/MacOS/Morph")"
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          helper_archs="$(lipo -archs "$helper/Contents/MacOS/MorphQuickConvert")"
          [[ "$helper_archs" == *arm64* && "$helper_archs" == *x86_64* ]]
          finder_sync_archs="$(lipo -archs "$finder_sync/Contents/MacOS/MorphFinderSync")"
          [[ "$finder_sync_archs" == *arm64* && "$finder_sync_archs" == *x86_64* ]]
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$helper/Contents/Info.plist" | grep -Fxq true
          /usr/libexec/PlistBuddy -c 'Print :LSFileQuarantineEnabled' "$app/Contents/Info.plist" | grep -Fxq true
          /usr/libexec/PlistBuddy -c 'Print :LSFileQuarantineEnabled' "$helper/Contents/Info.plist" | grep -Fxq true
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$finder_sync/Contents/Info.plist" | grep -Fxq true
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$finder_sync/Contents/Info.plist" | grep -Fxq com.apple.FinderSync
          app_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          helper_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$helper/Contents/Info.plist")"
          extension_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$finder_sync/Contents/Info.plist")"
          [[ "$app_build" == "$helper_build" && "$app_build" == "$extension_build" ]]
          codesign --verify --deep --strict "$app"
          for code in "$app" "$helper" "$finder_sync"; do
            signature="$(codesign --display --verbose=4 "$code" 2>&1)"
            [[ "$signature" == *runtime* ]]
            entitlements="$(codesign -d --entitlements :- "$code" 2>/dev/null || true)"
            [[ "$entitlements" != *get-task-allow* ]]
          done
          test -s "$app/Contents/Resources/Legal/LICENSE"
          test -s "$app/Contents/Resources/Legal/THIRD_PARTY.md"
          test -s "$app/Contents/Resources/Legal/THIRD_PARTY_LICENSES/Yams-MIT.txt"
          test -s "$app/Contents/Resources/Legal/THIRD_PARTY_LICENSES/LibYAML-MIT.txt"
          test -s "$app/Contents/Resources/Legal/THIRD_PARTY_LICENSES/Swift-TOML-MIT.txt"
          test -s "$app/Contents/Resources/Legal/THIRD_PARTY_LICENSES/toml++-MIT.txt"
          unzip -Z1 "$archive" | grep -Fxq "Morph-${version}/LICENSE"
          unzip -Z1 "$archive" | grep -Fxq "Morph-${version}/THIRD_PARTY_LICENSES/LibYAML-MIT.txt"
          unzip -Z1 "$archive" | grep -Fxq "Morph-${version}/Morph.app/Contents/Helpers/MorphQuickConvert.app/Contents/MacOS/MorphQuickConvert"
          unzip -Z1 "$archive" | grep -Fxq "Morph-${version}/Morph.app/Contents/PlugIns/MorphFinderSync.appex/Contents/MacOS/MorphFinderSync"
          if unzip -Z1 "$archive" | grep -Fq 'Convert with Morph.workflow'; then exit 1; fi
          if unzip -Z1 "$archive" | grep -Eq '(^|/)\._'; then exit 1; fi
          unzip -tq "$archive"
          (cd "$RUNNER_TEMP/morph-dist" && shasum -a 256 -c "Morph-${version}-macOS-universal.zip.sha256")
